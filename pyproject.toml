[project]
name = "retrieval-backend-with-rag"
version = "0.1.0"
description = "Vietnamese RAG backend and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.26.0",
    "chromadb==1.0.12",
    "fastembed==0.3.1",
    "flask",
    "flask-cors",
    "gdown==5.2.0",
    "google-cloud-aiplatform==1.49.0",
    "google-generativeai==0.6.0",
    "httpx==0.27.2",
    "ipython",
    "langchain==0.2.17",
    "mistralai",
    "onnxruntime==1.22.1",
    "openai==1.35.3",
    "pydantic==2.7.4",
    "pymongo",
    "python-dotenv",
    "qdrant-client",
    "ragas==0.3.0",
    "sacrebleu==2.5.1",
    "sentence-transformers",
    "transformers",
    "vertexai==1.49.0",
]

[tool.uv]
package = false
